# OLY VISION - Staff Classification Training Config
# ==================================================

experiment:
  name: "staff_classifier"
  task: "staff"
  description: "Train staff detection model (staff/non_staff)"

data:
  train_dir: "/home/nihit/highlander/data/prepared/staff/train"
  valid_dir: "/home/nihit/highlander/data/prepared/staff/valid"
  test_dir: "/home/nihit/highlander/data/prepared/staff/test"
  image_size: [224, 224]
  batch_size: 64
  num_workers: 4
  pin_memory: true
  
  augmentation:
    enabled: true
    horizontal_flip: 0.5
    brightness_limit: 0.2
    contrast_limit: 0.2
    rotate_limit: 10

model:
  # Lightweight model for binary classification
  architecture: "mobilenetv3_small_100"
  pretrained: true
  dropout: 0.3
  classifier:
    hidden_dims: [256, 128]
    use_batchnorm: true

training:
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: "adam"
  
  scheduler:
    type: "cosine_annealing"
  
  early_stopping:
    enabled: true
    patience: 7
    min_delta: 0.001
    monitor: "val_loss"
  
  class_weights: "balanced"
  gradient_clip: 1.0

hardware:
  device: "auto"
  mixed_precision: false

output:
  save_dir: "/home/nihit/highlander/artifacts/staff"
  save_every_epoch: false
  save_best_only: true
  
  artifacts:
    confusion_matrix: true
    classification_report: true
    learning_curves: true
    sample_predictions: true
    misclassified_images: true
    onnx_export: true

logging:
  level: "INFO"
  log_to_file: true
  tensorboard: false
