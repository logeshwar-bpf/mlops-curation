# OLY VISION - Model Training Configuration
# ==========================================
# Default configuration file for training classification models

# Experiment metadata
experiment:
  name: "default_experiment"
  task: "gender"  # gender, age, staff
  description: "Default training configuration"

# Data configuration
data:
  train_dir: "/data/prepared/train"
  valid_dir: "/data/prepared/valid"
  test_dir: "/data/prepared/test"
  
  # Image settings
  image_size: [224, 224]
  
  # DataLoader settings
  batch_size: 32
  num_workers: 4
  pin_memory: true
  
  # Augmentation (applied during training only)
  augmentation:
    enabled: true
    horizontal_flip: 0.5
    brightness_limit: 0.2
    contrast_limit: 0.2
    rotate_limit: 10
    
# Model configuration
model:
  # Architecture from timm library
  # Options: efficientnet_b0, efficientnet_b1, resnet18, resnet34, 
  #          mobilenetv3_small_100, mobilenetv3_large_100, vit_tiny_patch16_224
  architecture: "efficientnet_b0"
  pretrained: true
  dropout: 0.4
  
  # Custom classifier head
  classifier:
    hidden_dims: [512, 256]
    use_batchnorm: true

# Training configuration
training:
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.0001
  
  # Optimizer: adam, adamw, sgd
  optimizer: "adam"
  
  # Learning rate scheduler
  scheduler:
    type: "cosine_annealing"  # none, step, cosine_annealing, reduce_on_plateau
    # For step scheduler
    step_size: 10
    gamma: 0.1
    # For reduce_on_plateau
    patience: 5
    factor: 0.5
  
  # Early stopping
  early_stopping:
    enabled: true
    patience: 7
    min_delta: 0.001
    monitor: "val_loss"  # val_loss, val_accuracy
  
  # Class weights for imbalanced data
  class_weights: "balanced"  # none, balanced, or list of weights
  
  # Gradient clipping
  gradient_clip: 1.0

# Hardware configuration
hardware:
  device: "auto"  # auto, cuda, cpu
  mixed_precision: false  # Use automatic mixed precision (AMP)

# Output configuration
output:
  save_dir: "/artifacts/experiments"
  
  # Checkpointing
  save_every_epoch: false
  save_best_only: true
  
  # Artifacts to generate
  artifacts:
    confusion_matrix: true
    classification_report: true
    learning_curves: true
    sample_predictions: true
    misclassified_images: true
    onnx_export: true

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  log_to_file: true
  tensorboard: false
