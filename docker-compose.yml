services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: highlander-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: highlander
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d highlander"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 2. MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: highlander-minio
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # 3. OLY VISION Curation Web App
  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: highlander-webapp
    ports:
      - "5000:5000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: highlander
      DB_USER: postgres
      DB_PASSWORD: postgres
      MINIO_PUBLIC_URL: http://localhost:9000
      SECRET_KEY: olyvision-super-secret-production-key
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # 4. pgAdmin Database Management UI (Optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: highlander-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_DISABLE_POSTFIX: "true"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  pgadmin_data:
    driver: local
